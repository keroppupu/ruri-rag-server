version: '3.8'

services:
  ruri-rag-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ruri-rag-server
    ports:
      - "8000:8000"
    environment:
      - RURI_EMBED_MODEL=cl-nagoya/ruri-base
      - RURI_RERANK_MODEL=cl-nagoya/ruri-reranker-large
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen3.5:9b
      - CHROMA_DIR=/app/data/chroma
      - HF_HOME=/app/cache/huggingface
    volumes:
      # ベクトルDBデータ永続化
      - chroma_data:/app/data/chroma
      # HuggingFaceモデルキャッシュ永続化（再起動時のダウンロードを回避）
      - hf_cache:/app/cache/huggingface
    extra_hosts:
      # ホストマシンのOllamaに接続できるように設定
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

    # GPU（NVIDIA）を利用する場合は以下のコメントアウトを解除
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  chroma_data:
  hf_cache:
